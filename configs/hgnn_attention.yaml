
project:
  seed: 42
  device: auto
  top_k: 10

data:
  root: data
  split_method: per_user_temporal
  positive_threshold: 4.0

model:
  hidden_dim: 64
  num_layers: 2
  num_heads: 4
  dropout: 0.1

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 7
  batch_size: 1024

evaluation:
  metric: NDCG@10
  full_ranking: true
