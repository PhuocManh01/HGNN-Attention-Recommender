# MovieLens configuration

dataset:
  name: movielens
  raw_dir: movielens
  user_column: userId
  item_column: movieId
  rating_column: rating
  positive_threshold: 4.0

graph:
  node_types:
    - user
    - movie
    - genre

model:
  embedding_dim: 32
  hidden_dim: 64
  num_layers: 2
  attention_heads: 2
  dropout: 0.2

training:
  seed: 42
  epochs: 30
  batch_size: 512
  learning_rate: 0.001

evaluation:
  top_k: 10
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
